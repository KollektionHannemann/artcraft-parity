name: Update roadmap parity

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: roadmap-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check roadmaps, discover new apps, update data
        run: python3 scripts/update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "roadmap-tracker"
          git config user.email "roadmap-tracker@users.noreply.github.com"
          git add data apps.json
          if git diff --cached --quiet; then
            echo "No changes to the data or apps.json."
          else
            git commit -m "Update roadmap data ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi

      - name: Notify about new apps and roadmap updates
        run: python3 scripts/notify.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
